<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Colloquy of Mobiles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!--
      The site's one headline, held over everything for the whole page. There is
      no title page any more: the piece is the page, from the first pixel, and
      this is what says what is being looked at.

      Outside `main`, and fixed rather than in the flow, because it belongs to
      the site and not to the section under it. `safeArea()` in main.js keeps the
      camera's subject out from under it, the same as it does for the readout.
    -->
    <header class="site-head">
      <h1>The Colloquy of Mobiles</h1>
    </header>

    <main>
      <!--
        The title screen: a white page with the headline in the middle of it, and
        nothing else. It is empty because the headline is not in it — the headline
        is the fixed one above, held over the whole site, and this is the run of
        scroll it crosses on its way from the middle of the window to the top.
        main.js sizes that move off this section's height.
      -->
      <section class="title-screen" id="title-screen" aria-hidden="true"></section>

      <section class="pin-section" id="pin-section">
        <!--
          Full bleed: the scene is the page here, edge to edge, with the text
          laid over it rather than beside it. The stage and the readout are held
          for the whole pinned scroll; the text is a column floating over the
          right of it, and that column scrolls — its movement is the reading.
        -->
        <div class="pin-stage">
          <div class="stage" id="stage"></div>
          <p class="stage-error" id="stage-error" role="status"></p>
        </div>

        <!--
          The platform the text sits on: held still over the scene, and the box
          the text is actually inside rather than a strip painted behind it.

          It is a scroll container, and main.js drives its `scrollTop` from page
          scroll. That is what moves the reading. Doing it this way rather than
          clipping the track to a painted panel is deliberate — see the note on
          `.beat-column` in the stylesheet.
        -->
        <div class="beat-column" id="beat-column">
          <!--
            The beats are written by main.js, not authored here: the camera's own
            shot list supplies some and the recording's detected state changes
            supply the rest. Each is placed down this track at the scroll
            position of the moment it describes, so the track is as tall as the
            whole pinned section and the platform shows a window onto it.
          -->
          <div class="beat-track" id="beats"></div>
        </div>

        <!--
          Step to the previous or next headline. A sibling of the platform rather
          than something inside it: everything in there is on the track, and the
          track is what these move. They are held at the platform's foot, in a
          strip the text fades out above — see `--nav-band` in the stylesheet.
        -->
        <div class="beat-nav" id="beat-nav">
          <button type="button" class="beat-nav-button" id="beat-prev" aria-label="Previous section">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button type="button" class="beat-nav-button" id="beat-next" aria-label="Next section">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>

        <!--
          main.js builds the drive readout in here, if the clip carries one.

          A sibling of the track rather than a child of the stage, and above it:
          the text has to be able to fade out behind the bars as it leaves, and
          inside the stage the readout would be painted under the whole track.
        -->
        <div class="readout" id="drive-slot"></div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
